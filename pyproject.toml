[project]
name = "llm-api-service"
version = "0.1.0"
description = "Production-grade multi-provider async LLM REST & SSE API service with FastAPI, SQLAlchemy 2.0, and Alembic."
readme = "README.md"
authors = [
    { name = "satriowahyup", email = "satriowahyuprasetyo@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "google-genai>=3.5.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
llm-api-service = "llm_api_service:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["llm_api_service", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
